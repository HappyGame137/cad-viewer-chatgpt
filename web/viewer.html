<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CAD Viewer</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f8fafb,#152028);--fg:light-dark(#1e3038,#e0e9ed);--panel:light-dark(#edf2f3,#202f38);--line:light-dark(#c6d2d7,#42535f);--accent:light-dark(#087c78,#6fd8c7);--error:light-dark(#b3261e,#ffb4ac)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.3 system-ui,sans-serif}
main{height:100dvh;min-height:400px;display:flex;flex-direction:column;padding:8px 12px 5px;max-width:1400px;margin:auto}
header,.tools,.filebar,.cad-meta-row,#cad-measure-row,.part-picker{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0}
header{justify-content:space-between;margin-bottom:4px}
h1{font-size:15px;margin:0;font-weight:600}
button,select,input{font:inherit;color:inherit}
button,.file-label,select{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:3px 7px}
button,.file-label,select,input[type=range],input[type=checkbox]{cursor:pointer}
button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.file-label:focus-within{outline:2px solid var(--accent)}
.file-label input{position:absolute;width:1px;height:1px;opacity:0}
label{display:inline-flex;gap:4px;align-items:center}
input[type=range]{width:96px;max-width:20vw;accent-color:var(--accent)}
input[type=checkbox]{width:14px;height:14px;margin:0;accent-color:var(--accent)}
.tools{margin-bottom:3px}
.tools select{max-width:min(220px,75vw)}
#cad-parts-menu{position:relative}
#cad-parts-menu summary{cursor:pointer;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:3px 7px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cad-parts-popover{position:absolute;left:0;top:calc(100% + 3px);z-index:20;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px;width:max-content;max-width:min(360px,80vw);box-shadow:0 3px 12px #0003}
#cad-part-options{max-height:260px;overflow:auto;margin-top:5px;display:flex;flex-direction:column;gap:5px}
#cad-part-options label{overflow-wrap:anywhere;align-items:flex-start}
#cad-part-options input{flex:none;margin-top:1px}
.part-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
#cad-stage{position:relative;width:100%;flex:1 1 0;min-height:140px;overflow:hidden;border:1px solid var(--line);border-radius:6px}
canvas{display:block;width:100%;height:100%;touch-action:none}
#cad-caption{font-size:inherit;color:var(--fg)}
#cad-file-name{overflow-wrap:anywhere;min-width:0}
#cad-dims{margin-left:auto;font-variant-numeric:tabular-nums}
#cad-details{flex:none;display:flex;flex-direction:column;gap:1px;margin-top:3px;font-size:11.5px;line-height:1.15}
.cad-meta-row{gap:1px 12px}
#cad-measure-row{justify-content:space-between;gap:0 12px}
#cad-part-detail,#cad-measure-result,#cad-note,#cad-error{min-height:0;margin:0;overflow-wrap:anywhere}
#cad-measure-result{font-variant-numeric:tabular-nums}
#cad-error{color:var(--error)}
#cad-error:empty{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:500px){main{padding:7px 8px 5px}.tools{gap:5px}.cad-meta-row{gap:1px 8px}}
</style></head>
<body><main id="cad-viewer-app">
<header><h1 data-i18n="title">CAD Viewer · 三维查看与测量</h1><div class="filebar"><label class="file-label"><span data-i18n="open">打开文件</span><input id="cad-file" type="file" accept=".step,.stp,.stl" data-i18n-aria="open"></label><button id="cad-demo" type="button" data-i18n="demo">通用演示</button><select id="cad-language" aria-label="Language / 语言"><option value="zh" lang="zh-CN">中文</option><option value="en" lang="en">English</option></select></div></header>
<div class="tools">
<div class="part-picker"><span data-i18n="view">显示</span><details id="cad-parts-menu"><summary id="cad-part-summary" role="button" aria-expanded="false" aria-controls="cad-parts-popover">全部零件</summary><div id="cad-parts-popover"><div class="part-toolbar"><label><input id="cad-all-parts" type="checkbox" checked data-i18n-aria="allPartsAria"><span data-i18n="selectAll">全选</span></label><button id="cad-no-parts" type="button" data-i18n="selectNone">全不选</button></div><div id="cad-part-options" role="group" aria-label="显示零件" data-i18n-aria="partAria"></div></div></details></div>
<label><span data-i18n="explode">拆分</span> <input id="cad-explode" type="range" min="0" max="100" value="0" aria-label="装配拆分程度" data-i18n-aria="explodeAria"></label>
<label><input id="cad-section" type="checkbox"><span data-i18n="section">剖切</span></label><input id="cad-section-pos" type="range" min="-100" max="100" value="0" aria-label="剖切位置" data-i18n-aria="sectionAria" hidden>
<button id="cad-fit" type="button" data-i18n="fit">适合窗口</button>
</div>
<div class="tools">
<button id="cad-measure" type="button" aria-pressed="false" data-i18n="measure">两点测量</button>
<button id="cad-edge" type="button" aria-pressed="false" data-i18n="edgeMeasure">边沿测量</button>
<button id="cad-face" type="button" aria-pressed="false" data-i18n="faceMeasure">面测量</button>
<label><input id="cad-snap" type="checkbox" checked><span data-i18n="snap">顶点吸附</span></label>
<button id="cad-clear" type="button" data-i18n="clear">清除测量</button>
<label><span data-i18n="units">显示单位</span> <select id="cad-unit" data-i18n-aria="units"><option value="mm">mm</option><option value="cm">cm</option><option value="in">in</option></select></label>
<label><span data-i18n="stlUnits">STL 原始单位</span> <select id="cad-stl-unit" data-i18n-aria="stlUnits"><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="in">in</option></select></label>
</div>
<div id="cad-stage"><span class="sr-only" data-i18n="stageDescription">三维模型视图，支持旋转、缩放、零件选择和两点尺寸测量。</span></div>
<footer id="cad-details" aria-label="模型与测量说明" data-i18n-aria="detailsAria">
<div class="cad-meta-row"><span id="cad-file-name">选择 STEP / STL 文件</span><span id="cad-part-detail" aria-live="polite"></span><span id="cad-dims"></span></div>
<div id="cad-measure-row">
<div id="cad-measure-result" aria-live="polite">开启“两点测量”后，在模型上选择两个点。</div>
<span id="cad-caption" data-i18n="gestures">拖动旋转 · 滚轮缩放 · 右键拖动平移</span>
</div>
<div id="cad-note">STEP 按毫米转换；STL 无内置单位。测量基于显示网格，适合结构检查。</div>
<div id="cad-error" role="alert"></div>
</footer>
</main><script>/*__CAD_BUNDLE__*/</script></body></html>
