<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CAD Viewer</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f8fafb,#152028);--fg:light-dark(#1e3038,#e0e9ed);--panel:light-dark(#edf2f3,#202f38);--line:light-dark(#c6d2d7,#42535f);--accent:light-dark(#087c78,#6fd8c7);--error:light-dark(#b3261e,#ffb4ac)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}main{padding:16px;max-width:1400px;margin:auto}header,.tools,.filebar,.statusbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:12px}h1{font-size:18px;margin:0;font-weight:600}button,select,input{font:inherit;color:inherit}button,.file-label,select{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:6px 10px}button,.file-label,select,input[type=range],input[type=checkbox]{cursor:pointer}button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.file-label:focus-within{outline:2px solid var(--accent)}.file-label input{position:absolute;width:1px;height:1px;opacity:0}label{display:inline-flex;gap:5px;align-items:center}input[type=range]{max-width:125px;accent-color:var(--accent)}input[type=checkbox]{accent-color:var(--accent)}.tools{margin-bottom:10px}.tools select{max-width:min(300px,80vw)}#cad-stage{position:relative;width:100%;height:clamp(340px,60vh,620px);overflow:hidden;border:1px solid var(--line);border-radius:6px}canvas{display:block;width:100%;height:100%;touch-action:none}#cad-caption{position:absolute;bottom:10px;left:12px;right:12px;pointer-events:none;font-size:12px;color:var(--fg)}#cad-file-name{overflow-wrap:anywhere;min-width:0}#cad-dims{font-variant-numeric:tabular-nums}#cad-measure-result{min-height:30px;margin-top:10px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}#cad-error{color:var(--error);overflow-wrap:anywhere}#cad-note{font-size:12px;margin-top:5px}#cad-part-detail{min-height:22px;overflow-wrap:anywhere}.statusbar{justify-content:space-between;margin:8px 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:500px){main{padding:10px}.tools{gap:8px}#cad-stage{height:360px}}
</style></head>
<body><main id="cad-viewer-app">
<header><h1>CAD Viewer <span aria-hidden="true">·</span> 三维查看与测量</h1><div class="filebar"><label class="file-label">打开文件<input id="cad-file" type="file" accept=".step,.stp,.stl"></label><button id="cad-demo" type="button">通用演示</button></div></header>
<div class="tools">
<label>显示 <select id="cad-part" aria-label="显示零件"><option value="all">全部零件</option></select></label>
<label>拆分 <input id="cad-explode" type="range" min="0" max="100" value="0" aria-label="装配拆分程度"></label>
<label><input id="cad-section" type="checkbox">剖切</label><input id="cad-section-pos" type="range" min="-100" max="100" value="0" aria-label="剖切位置" hidden>
<button id="cad-fit" type="button">适合窗口</button>
</div>
<div class="tools">
<button id="cad-measure" type="button" aria-pressed="false">两点测量</button>
<label><input id="cad-snap" type="checkbox" checked>顶点吸附</label>
<button id="cad-clear" type="button">清除测量</button>
<label>显示单位 <select id="cad-unit"><option value="mm">mm</option><option value="cm">cm</option><option value="in">in</option></select></label>
<label>STL 原始单位 <select id="cad-stl-unit"><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="in">in</option></select></label>
</div>
<div class="statusbar"><span id="cad-file-name">选择 STEP / STL 文件</span><span id="cad-dims"></span></div>
<div id="cad-stage"><span class="sr-only">三维模型视图，支持旋转、缩放、零件选择和两点尺寸测量。</span><div id="cad-caption">拖动旋转 · 滚轮缩放 · 右键拖动平移</div></div>
<div id="cad-part-detail" aria-live="polite"></div>
<div id="cad-measure-result" aria-live="polite">开启“两点测量”后，在模型上选择两个点。</div>
<div id="cad-note">STEP 按毫米转换；STL 无内置单位。测量基于显示网格，适合结构检查。</div>
<div id="cad-error" role="alert"></div>
</main><script>/*__CAD_BUNDLE__*/</script></body></html>
